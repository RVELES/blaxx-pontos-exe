<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" width="800" height="210" role="img" aria-label="BLAXX pontos">
  <title>BLAXX pontos</title>
  <!--
    Variante para superfícies CLARAS: "BLA" e X esquerdo em preto #0A0A0A,
    X direito e filetes em verde-limão #C6F432. Mesma geometria do
    blaxx-logo.svg (versão escura/branca).
  -->
  <rect width="800" height="210" fill="none"/>

  <text x="20" y="158"
        font-family="'Avenir Next Condensed','Helvetica Neue',Arial,sans-serif"
        font-size="176" font-weight="900" letter-spacing="-2"
        fill="#0A0A0A">BLA</text>

  <g stroke="#0A0A0A" stroke-width="38" stroke-linecap="butt">
    <line x1="356" y1="36" x2="544" y2="158"/>
    <line x1="544" y1="36" x2="356" y2="158"/>
  </g>
  <g stroke="#C6F432" stroke-width="38" stroke-linecap="butt">
    <line x1="452" y1="36" x2="640" y2="158"/>
    <line x1="640" y1="36" x2="452" y2="158"/>
  </g>

  <g transform="translate(0,190)">
    <line x1="120" y1="0" x2="285" y2="0" stroke="#8FB81F" stroke-width="3"/>
    <text x="400" y="7" text-anchor="middle"
          font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif"
          font-size="30" font-weight="500" letter-spacing="16"
          fill="#0A0A0A">PONTOS</text>
    <line x1="515" y1="0" x2="680" y2="0" stroke="#8FB81F" stroke-width="3"/>
  </g>
</svg>

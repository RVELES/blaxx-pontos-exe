<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Extrato · Blaxx Pontos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/design-system.css" />
</head>
<body>
  <div class="app-shell">
    <div id="side"></div>
    <main class="main">
      <div id="top"></div>

      <!-- Toolbar de filtros -->
      <div class="card">
        <div class="row" style="gap:12px;align-items:center;flex-wrap:wrap;">
          <input id="ex-search" type="search" placeholder="Buscar por descrição…"
                 autocomplete="off" style="flex:1;min-width:200px;" />
          <select id="ex-type" style="min-width:200px;">
            <option value="">Todos os tipos</option>
            <option value="purchase">Compra de pontos</option>
            <option value="transfer_in">Recebido</option>
            <option value="transfer_out">Enviado</option>
            <option value="redeem">Resgate</option>
            <option value="refund">Estorno</option>
            <option value="bonus">Bônus</option>
          </select>
          <select id="ex-limit" style="min-width:120px;">
            <option value="50">50 últimas</option>
            <option value="100">100 últimas</option>
            <option value="200">200 últimas</option>
            <option value="500">500 últimas</option>
          </select>
        </div>
        <div class="muted mt-2" style="font-size:12px;" id="ex-count">—</div>
      </div>

      <!-- Tabela de transações -->
      <div class="card mt-6">
        <div id="ex-list">Carregando…</div>
      </div>
    </main>
  </div>

  <script src="../assets/app.js"></script>
  <script>
    if (Session.requireAuth()) {
      document.getElementById('side').outerHTML = renderSidebar('extrato');
      document.getElementById('top').outerHTML = renderTopbar({eyebrow:'Movimentações', title:'Extrato'});

      let ALL = [];

      function statusChipClass(s) {
        if (s === 'confirmed') return 'success';
        if (s === 'reversed')  return 'danger';
        return 'warning';
      }

      function typeLabel(t) {
        return {
          purchase:     'Compra de pontos',
          transfer_in:  'Recebido',
          transfer_out: 'Enviado',
          redeem:       'Resgate',
          refund:       'Estorno',
          bonus:        'Bônus',
        }[t] || t;
      }

      function render() {
        const q = (document.getElementById('ex-search').value || '').toLowerCase().trim();
        const typeFilter = document.getElementById('ex-type').value;
        const filtered = ALL.filter(x => {
          if (typeFilter && x.type !== typeFilter) return false;
          if (q && !((x.description || '').toLowerCase().includes(q))) return false;
          return true;
        });

        const countEl = document.getElementById('ex-count');
        countEl.textContent = filtered.length === ALL.length
          ? `${ALL.length} transações`
          : `${filtered.length} de ${ALL.length} transações`;

        const listEl = document.getElementById('ex-list');
        if (!filtered.length) {
          listEl.innerHTML = '<p class="muted" style="text-align:center;padding:24px;">Nenhuma transação para os filtros aplicados.</p>';
          return;
        }

        listEl.innerHTML = `
          <table class="blaxx">
            <thead>
              <tr>
                <th>Tipo</th>
                <th>Descrição</th>
                <th>Status</th>
                <th style="text-align:right;">Pontos</th>
                <th>Data</th>
              </tr>
            </thead>
            <tbody>
            ${filtered.map(x => `
              <tr>
                <td><span class="chip ${x.amount_pts > 0 ? 'success' : ''}">${typeLabel(x.type)}</span></td>
                <td>${x.description || '—'}</td>
                <td><span class="chip ${statusChipClass(x.status)}">${x.status}</span></td>
                <td style="text-align:right;" class="${x.amount_pts > 0 ? 'amount-pos' : 'amount-neg'}">
                  ${x.amount_pts > 0 ? '+' : ''}${Number(x.amount_pts).toLocaleString('pt-BR')}
                </td>
                <td class="muted" style="white-space:nowrap;">${fmtDateTime(x.created_at)}</td>
              </tr>
            `).join('')}
            </tbody>
          </table>`;
      }

      async function reload() {
        const limit = document.getElementById('ex-limit').value;
        document.getElementById('ex-list').innerHTML = 'Carregando…';
        try {
          const t = await api('/wallet/transactions?limit=' + encodeURIComponent(limit));
          ALL = t.transactions || t.items || t || [];
          render();
        } catch (e) {
          document.getElementById('ex-list').innerHTML =
            `<p class="muted" style="text-align:center;padding:24px;color:#ff6b6b;">Falha ao carregar: ${e.message}</p>`;
        }
      }

      // Re-render local (sem refetch) quando muda search ou type
      document.getElementById('ex-search').addEventListener('input', render);
      document.getElementById('ex-type').addEventListener('change', render);
      // Refetch quando muda limite (precisa ir no backend)
      document.getElementById('ex-limit').addEventListener('change', reload);

      reload();
    }
  </script>
</body>
</html>
